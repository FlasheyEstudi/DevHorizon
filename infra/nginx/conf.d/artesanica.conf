# =============================================================================
# ArtesaNica — sitio en HTTP (:80) con proxy inverso a los contenedores
# =============================================================================
#
#   navegador ──► nginx :80 ──┬──► 127.0.0.1:4322  web (Astro SSR, contenedor)
#                             ├──► 127.0.0.1:8091  pocketbase (contenedor)
#                             └──  /pb/api/files/*  archivos e imágenes de PB
#
# Por qué /pb/: el navegador nunca debe hablar con PocketBase directamente (no
# está publicado a internet). El frontend genera las URLs de archivos con la
# base pública `PUBLIC_POCKETBASE_URL=/pb`, de modo que las imágenes se sirven
# por el mismo origen y la CSP puede quedarse en `'self'`.
#
# Instalación:
#   sudo cp infra/nginx/conf.d/artesanica.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Para HTTPS: ver infra/nginx/conf.d/artesanica-tls.conf.example
# =============================================================================

upstream artesanica_web {
    server 127.0.0.1:4322;
    keepalive 16;
}

upstream artesanica_pb {
    server 127.0.0.1:8091;
    keepalive 16;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;              # <<< cambia por tu dominio (ej. artesanica.com.ni)

    # Cabeceras de seguridad en el borde (CSP, X-Frame-Options, etc.)
    include /etc/nginx/snippets/security-headers.conf;

    # -------------------------------------------------------------------------
    # Assets con hash generados por el build de Astro: caché inmutable.
    # Se repite el include de seguridad porque `add_header` no se hereda.
    # -------------------------------------------------------------------------
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://artesanica_web;
        # El servidor Node envía `Cache-Control: public, max-age=0`; si no se
        # oculta, la respuesta sale con DOS cabeceras y los navegadores aplican
        # la más restrictiva (se perdería la caché inmutable).
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Imágenes y archivos servidos por PocketBase, en el mismo origen.
    # Sólo se publica /api/files/*: el resto de la API de PocketBase queda
    # inaccesible desde internet (los endpoints de la app viven en /api/*).
    # -------------------------------------------------------------------------
    location /pb/api/files/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://artesanica_pb/api/files/;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600";
    }

    # Cualquier otra ruta bajo /pb/ se bloquea explícitamente.
    location /pb/ {
        return 404;
    }

    # Panel de administración de PocketBase fuera de internet.
    location = /_/ {
        return 404;
    }

    # -------------------------------------------------------------------------
    # Endpoints de autenticación: límite más estricto (login, registro, 2FA).
    # El backend aplica además sus propios límites e intentos por usuario.
    # -------------------------------------------------------------------------
    location /api/auth/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy-common.conf;
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://artesanica_web;
    }

    # -------------------------------------------------------------------------
    # Resto de la API de la aplicación.
    # -------------------------------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy-common.conf;
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://artesanica_web;
    }

    # -------------------------------------------------------------------------
    # Todo lo demás: páginas SSR de Astro.
    # -------------------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://artesanica_web;
    }

    # -------------------------------------------------------------------------
    # Desafío ACME para certbot (emitir/renovar el certificado TLS).
    # Ver infra/nginx/conf.d/artesanica-tls.conf.example
    # -------------------------------------------------------------------------
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Comprobación de salud del borde (útil para monitoreo externo).
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
