# =============================================================================
# ArtesaNica — configuración global de nginx (borde / proxy inverso)
# =============================================================================
# Instalación en el host (Arch / CachyOS):
#   sudo pacman -S nginx
#   sudo cp infra/nginx/nginx.conf /etc/nginx/nginx.conf
#   sudo cp infra/nginx/conf.d/*.conf /etc/nginx/conf.d/
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp infra/nginx/snippets/*.conf /etc/nginx/snippets/
#   sudo nginx -t && sudo systemctl enable --now nginx
#
# Este archivo NO sirve el sitio por sí solo: los sitios/proxies viven en
# /etc/nginx/conf.d/*.conf (ver infra/nginx/conf.d/artesanica.conf).
#
# Es la ÚNICA puerta de entrada: Astro y PocketBase escuchan sólo en loopback
# (127.0.0.1:4322 y 127.0.0.1:8091) y nunca se exponen directamente.
# =============================================================================

user  http;                 # usuario estándar en Arch/CachyOS
worker_processes  auto;
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    # En Arch/CachyOS `mime.types` lo aporta el paquete `mailcap`, del que nginx
    # es dependiente: instala /etc/nginx/mime.types además de /etc/mime.types.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time urt="$upstream_response_time"';
    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;               # no revelar la versión de nginx
    types_hash_max_size 4096;

    # Subidas: imágenes de producto y avatares llegan a 5 MB (multipart + margen)
    client_max_body_size 12m;
    client_body_timeout  30s;

    # Compresión (los estáticos de Astro ya vienen minificados)
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml application/rss+xml
                      image/svg+xml;

    # --- Límites de tasa en el borde -----------------------------------------
    # Complementan (no sustituyen) los límites propios de la app y de PocketBase.
    limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m  rate=30r/m;
    limit_req_status 429;

    # Necesario para permitir upgrades (SSE / websockets) a través del proxy
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Oculta el panel de administración de PocketBase hacia fuera: sólo se
    # accede por el túnel SSH. Se declara aquí para todos los vhosts.
    # (Ver también las reglas `location` de conf.d/artesanica.conf)

    include /etc/nginx/conf.d/*.conf;
}
