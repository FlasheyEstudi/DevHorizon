# =============================================================================
# Snippet: cabeceras de seguridad del borde
# =============================================================================
# Equivalen a las que hoy aplica Vercel (astro.config.mjs) pero en el proxy
# inverso, que es lo que realmente recibe el tráfico en el autoalojado.
#
# IMPORTANTE (trampa clásica de nginx): `add_header` NO se hereda en bloques
# que declaran sus propios `add_header`. Por eso este snippet se incluye
# explícitamente en cada location que añada cabeceras propias (por ejemplo la
# caché inmutable de /_astro/).
#
# La CSP mantiene los orígenes de tiles del mapa y de PocketHost (respaldo en
# la nube); PocketBase en el mismo origen entra por `'self'`.
# HOSTING DE IMÁGENES: `i.postimg.cc`/`postimg.cc` están en img-src porque
# `src/components/auth/AuthPanel.astro` usa por defecto una imagen alojada ahí
# (imagen de los paneles de login/registro). Sin estos orígenes, la CSP del
# autoalojado bloquearía esa imagen — el config de Vercel ya los incluía.
# =============================================================================

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://i.postimg.cc https://postimg.cc https://*.tile.openstreetmap.org https://*.arcgisonline.com https://server.arcgisonline.com https://*.pockethost.io https://vapor-invented.pockethost.io data: blob:; font-src 'self' data:; connect-src 'self' https://*.tile.openstreetmap.org https://*.arcgisonline.com https://server.arcgisonline.com https://router.project-osrm.org https://*.pockethost.io https://vapor-invented.pockethost.io; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
